name: Project checks

on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        preset: [debug, asan]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=g++-13
          -DCLANG_FORMAT_EXE=/usr/bin/clang-format-18
          -DCLANG_TIDY_EXE=/usr/bin/clang-tidy-18
      - name: Build and test
        run: |
          cmake --build --preset ${{ matrix.preset }} --parallel 4
          ctest --preset ${{ matrix.preset }} --output-on-failure --parallel 4
      - name: Check formatting, static analysis and scripts
        if: matrix.preset == 'debug'
        run: |
          cmake --build --preset debug --target format-check tidy
          python3 -m unittest discover -s scripts -p 'test_*.py'
